# language: YAML, file: .github/workflows/build.yml
name: build-jailbreak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: kfd_a15
  SCHEME: kfd_a15
  CONFIG: Release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: verify repo files
        run: |
          set -euo pipefail
          for f in project.yml kfd_a15/kfd_a15.c; do
            test -s "$f" || { echo "[-] repo missing $f"; exit 1; }
            echo "[+] $f $(wc -c < "$f") bytes"
          done

      - name: write missing files
        run: |
          set -euo pipefail
          mkdir -p kfd_a15 bootstrap

          # never overwrite the repo's project.yml or kfd_a15.c
          test -s project.yml          || { echo "[-] project.yml missing"; exit 1; }
          test -s kfd_a15/kfd_a15.c    || { echo "[-] kfd_a15.c missing"; exit 1; }

          cat > kfd_a15/App.swift <<'EOF'
          import SwiftUI

          @main
          struct KFDApp: App {
              @StateObject private var state = ChainState()
              var body: some Scene {
                  WindowGroup { ContentView().environmentObject(state).preferredColorScheme(.dark) }
              }
          }

          final class ChainState: ObservableObject {
              @Published var status: String = "idle"
              @Published var running: Bool = false
              @Published var rwLive: Bool = false
              @Published var uid: UInt32 = 501
              private let queue = DispatchQueue(label: "kfd.chain", qos: .userInitiated)

              func start() {
                  guard !running else { return }
                  running = true; status = "starting chain"
                  queue.async {
                      let ok = kfd_a15_run()
                      DispatchQueue.main.async {
                          self.rwLive = (ok == 0)
                          self.status = (ok == 0) ? "kernel r/w live" : "chain failed"
                          if ok == 0 { self.uid = kfd_a15_read_uid() }
                          self.running = false
                      }
                  }
              }

              func bootstrap() {
                  guard rwLive else { status = "no r/w"; return }
                  running = true; status = "installing /var/jb"
                  queue.async {
                      let ok = install_bootstrap()
                      DispatchQueue.main.async {
                          self.status = (ok == 0) ? "Sileo at /var/jb" : "bootstrap failed"
                          self.running = false
                      }
                  }
              }
          }

          struct ContentView: View {
              @EnvironmentObject var state: ChainState
              var body: some View {
                  VStack(spacing: 28) {
                      Image(systemName: state.rwLive ? "bolt.shield.fill" : "bolt.shield")
                          .font(.system(size: 64))
                          .foregroundStyle(state.rwLive ? .green : .orange)
                      Text("kfd / A15").font(.largeTitle.monospaced())
                      Text(state.status).font(.callout.monospaced()).foregroundStyle(.secondary)
                      Text("uid \(state.uid)").font(.caption.monospaced())
                      Button(action: state.start) { Text("run chain").frame(maxWidth: .infinity) }
                          .buttonStyle(.borderedProminent).disabled(state.running)
                      Button(action: state.bootstrap) { Text("install bootstrap").frame(maxWidth: .infinity) }
                          .buttonStyle(.bordered).disabled(!state.rwLive || state.running)
                  }.padding(40)
              }
          }
          EOF

          cat > kfd_a15/Bootstrap.swift <<'EOF'
          import Foundation

          @_cdecl("bootstrap_main")
          public func bootstrap_main() -> Int32 {
              let fm = FileManager.default
              let root = "/var/jb"
              let bundle = Bundle.main.bundlePath
              let tar = "\(bundle)/bootstrap/procursus-rootless.tar"
              let sileo = "\(bundle)/bootstrap/Sileo.deb"
              guard fm.fileExists(atPath: tar) else { return 1 }
              var st = stat()
              if stat(root, &st) != 0 { if mkdir(root, 0o755) != 0 { return 2 } }
              guard spawn("/usr/bin/tar", ["-xpf", tar, "-C", root]) == 0 else { return 3 }
              _ = spawn("/usr/bin/find", [root, "-exec", "/usr/bin/chown", "mobile:mobile", "{}", "+"])
              _ = spawn("\(root)/usr/bin/dpkg", ["-i", sileo])
              let daemons = "\(root)/Library/LaunchDaemons"
              if let jobs = try? fm.contentsOfDirectory(atPath: daemons) {
                  for job in jobs where job.hasSuffix(".plist") {
                      _ = spawn("\(root)/bin/launchctl", ["bootstrap", "system", "\(daemons)/\(job)"])
                  }
              }
              return 0
          }

          private func spawn(_ path: String, _ args: [String]) -> Int32 {
              let cArgs = args.map { strdup($0) } + [nil]
              defer { cArgs.forEach { free($0) } }
              var pid: pid_t = 0
              var actions: posix_spawnattr_t?
              var fileActions: posix_spawn_file_actions_t?
              posix_spawnattr_init(&actions)
              posix_spawn_file_actions_init(&fileActions)
              let rc = path.withCString { cPath in
                  posix_spawn(&pid, cPath, &fileActions, &actions, cArgs, environ)
              }
              posix_spawnattr_destroy(&actions)
              posix_spawn_file_actions_destroy(&fileActions)
              if rc != 0 { return -1 }
              var status: Int32 = 0
              waitpid(pid, &status, 0)
              return status
          }
          EOF

          cat > kfd_a15/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>com.kfd.a15</string>
              <key>CFBundleName</key><string>kfd</string>
              <key>CFBundleExecutable</key><string>kfd_a15</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UILaunchScreen</key><dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          EOF

          cat > kfd_a15/kfd_a15.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key><true/>
              <key>com.apple.private.skip-library-validation</key><true/>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>com.apple.private.persona-mgmt</key><true/>
              <key>get-task-allow</key><true/>
              <key>task_for_pid-allow</key><true/>
              <key>com.apple.system-task-ports</key><true/>
          </dict>
          </plist>
          EOF

          # strip the block-scalar indent from the generated files
          for f in kfd_a15/Bridge.h kfd_a15/Bridge.m kfd_a15/App.swift \
                   kfd_a15/Bootstrap.swift kfd_a15/Info.plist \
                   kfd_a15/kfd_a15.entitlements; do
            sed -i '' 's/^          //' "$f"
          done

          # prove nothing was written indented and the repo files survived
          head -n 1 kfd_a15/Bridge.h
          head -n 1 kfd_a15/App.swift
          head -n 1 project.yml
          head -n 1 kfd_a15/kfd_a15.c

      - name: fetch bootstrap payloads
        run: |
          set -euo pipefail
          cd bootstrap
          BASE="https://apt.procurs.us/dists/1900"
          ARCH="iphoneos-arm64"
          PKG_INDEX="${BASE}/main/binary-${ARCH}/Packages.zst"
          brew install zstd dpkg
          curl -fL -o /tmp/Packages.zst "${PKG_INDEX}"
          zstd -d -f /tmp/Packages.zst -o /tmp/Packages
          echo "[+] index: $(wc -l < /tmp/Packages) lines"
          for PKG in base bootstrap-cmds; do
            FILE=$(awk -v p="$PKG" '$0=="Package: "p{f=1} f&&/^Filename:/{print $2; exit}' /tmp/Packages)
            if [ -z "${FILE}" ]; then echo "[-] no Filename for ${PKG}"; exit 1; fi
            echo "[+] ${PKG}: ${FILE}"
            curl -fL -o "${PKG}.deb" "https://apt.procurs.us/${FILE}"
            dpkg-deb -x "${PKG}.deb" extracted/
          done
          SILEO_FILE=$(awk '$0=="Package: org.coolstar.sileo"{f=1} f&&/^Filename:/{print $2; exit}' /tmp/Packages)
          if [ -n "${SILEO_FILE}" ]; then
            curl -fL -o Sileo.deb "https://apt.procurs.us/${SILEO_FILE}"
          fi
          tar -cf procursus-rootless.tar -C extracted .
          test -s procursus-rootless.tar
          ls -la

      - name: generate project
        run: |
          set -euo pipefail
          brew install xcodegen ldid
          xcodegen generate --spec project.yml

      - name: build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ${APP_NAME}.xcodeproj \
            -scheme ${SCHEME} \
            -configuration ${CONFIG} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64e VALID_ARCHS=arm64e \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: package .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/${CONFIG}-iphoneos -maxdepth 1 -name "${APP_NAME}.app" | head -n1)
          test -n "$APP_PATH"
          test -x "$APP_PATH/${APP_NAME}" || { echo "[-] executable missing at $APP_PATH/${APP_NAME}"; exit 1; }

          mkdir -p "$APP_PATH/bootstrap"
          cp bootstrap/procursus-rootless.tar "$APP_PATH/bootstrap/"
          cp bootstrap/Sileo.deb "$APP_PATH/bootstrap/"

          # entitlements must be a real plist; an empty or indented file
          # is what makes ldid assert at ldid.cpp(852).
          test -s kfd_a15/kfd_a15.entitlements
          grep -q '<plist' kfd_a15/kfd_a15.entitlements || { echo "[-] entitlements not a plist"; exit 1; }
          sed -i '' 's/^          //' kfd_a15/kfd_a15.entitlements || true

          # strip any signature the build left, then sign with ldid
          codesign --remove-signature "$APP_PATH/${APP_NAME}" 2>/dev/null || true
          ldid -S kfd_a15/kfd_a15.entitlements "$APP_PATH/${APP_NAME}"
          ldid -e "$APP_PATH/${APP_NAME}" | head -n 20

          mkdir -p Payload
          rm -rf Payload/*
          cp -R "$APP_PATH" Payload/
          rm -f "${APP_NAME}-unsigned.ipa"
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -la "${APP_NAME}-unsigned.ipa"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfd-a15-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 14
