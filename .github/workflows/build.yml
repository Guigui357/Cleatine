# language: YAML, file: .github/workflows/build-jailbreak.yml, target: GitHub Actions
name: build-jailbreak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: kfd_a15
  BUNDLE_ID: com.kfd.a15
  SCHEME: kfd_a15
  CONFIG: Release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: write project tree
        run: |
          set -euo pipefail
          mkdir -p $GITHUB_WORKSPACE/kfd_a15 $GITHUB_WORKSPACE/bootstrap

          cat > $GITHUB_WORKSPACE/project.yml <<'YAML'
          name: kfd_a15
          options:
            bundleIdPrefix: com.kfd
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              ARCHS: arm64e
              VALID_ARCHS: arm64e
              ONLY_ACTIVE_ARCH: NO
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              SWIFT_VERSION: "5.9"
              HEADER_SEARCH_PATHS:
                - $(SRCROOT)/kfd_a15
          targets:
            kfd_a15:
              type: application
              platform: iOS
              sources:
                - path: kfd_a15
                  excludes:
                    - Info.plist
                    - kfd_a15.entitlements
              settings:
                base:
                  INFOPLIST_FILE: kfd_a15/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.kfd.a15
                  PRODUCT_NAME: kfd_a15
                  CODE_SIGN_ENTITLEMENTS: kfd_a15/kfd_a15.entitlements
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_OBJC_BRIDGING_HEADER: kfd_a15/Bridge.h
          YAML

          cat > $GITHUB_WORKSPACE/kfd_a15/Bridge.h <<'EOF'
          #ifndef BRIDGE_H
          #define BRIDGE_H
          #include <stdint.h>
          int      kfd_a15(void);
          uint32_t kfd_a15_read_uid(void);
          int      bootstrap_main(void);
          #endif
          EOF

          cat > $GITHUB_WORKSPACE/kfd_a15/Bridge.m <<'EOF'
          #import "Bridge.h"
          #include <unistd.h>
          int kfd_a15_run(void) { return kfd_a15(); }
          uint32_t kfd_a15_read_uid(void) { return (uint32_t)getuid(); }
          int install_bootstrap(void) { return bootstrap_main(); }
          EOF

          cat > $GITHUB_WORKSPACE/kfd_a15/App.swift <<'EOF'
          import SwiftUI

          @main
          struct KFDApp: App {
              @StateObject private var state = ChainState()
              var body: some Scene {
                  WindowGroup { ContentView().environmentObject(state).preferredColorScheme(.dark) }
              }
          }

          final class ChainState: ObservableObject {
              @Published var status: String = "idle"
              @Published var running: Bool = false
              @Published var rwLive: Bool = false
              @Published var uid: UInt32 = 501
              private let queue = DispatchQueue(label: "kfd.chain", qos: .userInitiated)

              func start() {
                  guard !running else { return }
                  running = true; status = "starting chain"
                  queue.async {
                      let ok = kfd_a15_run()
                      DispatchQueue.main.async {
                          self.rwLive = (ok == 0)
                          self.status = (ok == 0) ? "kernel r/w live" : "chain failed"
                          if ok == 0 { self.uid = kfd_a15_read_uid() }
                          self.running = false
                      }
                  }
              }

              func bootstrap() {
                  guard rwLive else { status = "no r/w"; return }
                  running = true; status = "installing /var/jb"
                  queue.async {
                      let ok = install_bootstrap()
                      DispatchQueue.main.async {
                          self.status = (ok == 0) ? "Sileo at /var/jb" : "bootstrap failed"
                          self.running = false
                      }
                  }
              }
          }

          struct ContentView: View {
              @EnvironmentObject var state: ChainState
              var body: some View {
                  VStack(spacing: 28) {
                      Image(systemName: state.rwLive ? "bolt.shield.fill" : "bolt.shield")
                          .font(.system(size: 64))
                          .foregroundStyle(state.rwLive ? .green : .orange)
                      Text("kfd / A15").font(.largeTitle.monospaced())
                      Text(state.status).font(.callout.monospaced()).foregroundStyle(.secondary)
                      Text("uid \(state.uid)").font(.caption.monospaced())
                      Button(action: state.start) { Text("run chain").frame(maxWidth: .infinity) }
                          .buttonStyle(.borderedProminent).disabled(state.running)
                      Button(action: state.bootstrap) { Text("install bootstrap").frame(maxWidth: .infinity) }
                          .buttonStyle(.bordered).disabled(!state.rwLive || state.running)
                  }.padding(40)
              }
          }
          EOF

          cat > $GITHUB_WORKSPACE/kfd_a15/Bootstrap.swift <<'EOF'
          import Foundation

          @_cdecl("bootstrap_main")
          public func bootstrap_main() -> Int32 {
              let fm = FileManager.default
              let root = "/var/jb"
              let bundle = Bundle.main.bundlePath
              let tar = "\(bundle)/bootstrap/procursus-rootless.tar"
              let sileo = "\(bundle)/bootstrap/Sileo.deb"
              guard fm.fileExists(atPath: tar) else { return 1 }
              var st = stat()
              if stat(root, &st) != 0 { if mkdir(root, 0o755) != 0 { return 2 } }
              guard spawn("/usr/bin/tar", ["-xpf", tar, "-C", root]) == 0 else { return 3 }
              _ = spawn("/usr/bin/find", [root, "-exec", "/usr/bin/chown", "mobile:mobile", "{}", "+"])
              _ = spawn("\(root)/usr/bin/dpkg", ["-i", sileo])
              let daemons = "\(root)/Library/LaunchDaemons"
              if let jobs = try? fm.contentsOfDirectory(atPath: daemons) {
                  for job in jobs where job.hasSuffix(".plist") {
                      _ = spawn("\(root)/bin/launchctl", ["bootstrap", "system", "\(daemons)/\(job)"])
                  }
              }
              return 0
          }

          private func spawn(_ path: String, _ args: [String]) -> Int32 {
              let p = Process()
              p.executableURL = URL(fileURLWithPath: path)
              p.arguments = args
              do { try p.run(); p.waitUntilExit(); return p.terminationStatus } catch { return -1 }
          }
          EOF

          cat > $GITHUB_WORKSPACE/kfd_a15/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>com.kfd.a15</string>
              <key>CFBundleName</key><string>kfd</string>
              <key>CFBundleExecutable</key><string>kfd_a15</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UILaunchScreen</key><dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          EOF

          cat > $GITHUB_WORKSPACE/kfd_a15/kfd_a15.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key><true/>
              <key>com.apple.private.skip-library-validation</key><true/>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>com.apple.private.persona-mgmt</key><true/>
              <key>get-task-allow</key><true/>
              <key>task_for_pid-allow</key><true/>
              <key>com.apple.system-task-ports</key><true/>
          </dict>
          </plist>
          EOF

          # strip the block-scalar indent so files land at column zero
          for f in project.yml \
                   $GITHUB_WORKSPACE/kfd_a15/Bridge.h $GITHUB_WORKSPACE/kfd_a15/Bridge.m $GITHUB_WORKSPACE/kfd_a15/App.swift \
                   $GITHUB_WORKSPACE/kfd_a15/Bootstrap.swift $GITHUB_WORKSPACE/kfd_a15/kfd_a15.c \
                   $GITHUB_WORKSPACE/kfd_a15/Info.plist $GITHUB_WORKSPACE/kfd_a15/kfd_a15.entitlements; do
            sed -i '' 's/^          //' "$f"
          done

          # verify
          head -n 1 $GITHUB_WORKSPACE/project.yml
          head -n 1 $GITHUB_WORKSPACE/kfd_a15/Bridge.h
          echo "[+] project tree written"

      - name: fetch bootstrap payloads
        run: |
          set -euo pipefail
          cd bootstrap

          # rootless suites live under dists/<suite>/ — NOT the server root.
          # 1800 = iOS 15 rootless, 1900 = iOS 16+ rootless.
          PROCURSUS_SUITE="1900"
          PROCURSUS_BASE="https://apt.procurs.us/dists/${PROCURSUS_SUITE}"

          # 1. probe the suite index first — fail fast if the suite or the
          #    asset name is not what this step expects.
          echo "== suite index =="
          curl -fsSL "${PROCURSUS_BASE}/" | tee /tmp/suite.html | head -n 60
          echo

          # 2. discover the real bootstrap asset name from the listing.
          #    the filename has changed across releases; do not hardcode it.
          BOOTSTRAP_ASSET=$(grep -oE 'bootstrap-[^"<> ]+\.tar\.(zst|xz|gz)' /tmp/suite.html | head -n1 || true)
          if [ -z "${BOOTSTRAP_ASSET}" ]; then
            echo "[-] no bootstrap asset listed under ${PROCURSUS_BASE}/"
            echo "[-] open that URL and read the listing; paste the filename"
            exit 1
          fi
          echo "[+] bootstrap asset: ${BOOTSTRAP_ASSET}"

          # 3. fetch it.
          curl -fL -o "${BOOTSTRAP_ASSET}" "${PROCURSUS_BASE}/${BOOTSTRAP_ASSET}"

          # 4. fetch Sileo from the pool.
          curl -fL -o Sileo.deb \
            "https://apt.procurs.us/pool/main/org.coolstar.sileo_arm64.deb"

          # 5. normalise to the name the app expects.
          case "${BOOTSTRAP_ASSET}" in
            *.tar.zst) brew install zstd; zstd -d "${BOOTSTRAP_ASSET}" -o procursus-rootless.tar ;;
            *.tar.xz)  xz -d -c "${BOOTSTRAP_ASSET}" > procursus-rootless.tar ;;
            *.tar.gz)  gzip -d -c "${BOOTSTRAP_ASSET}" > procursus-rootless.tar ;;
            *.tar)     cp "${BOOTSTRAP_ASSET}" procursus-rootless.tar ;;
          esac

          ls -la
          tar -tf procursus-rootless.tar | head -n 10

      - name: generate project
        run: |
          set -euo pipefail
          brew install xcodegen ldid
          xcodegen generate --spec project.yml

      - name: build unsigned .app
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          xcodebuild \
            -project ${APP_NAME}.xcodeproj \
            -scheme ${SCHEME} \
            -configuration ${CONFIG} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64e VALID_ARCHS=arm64e \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: package .ipa
        id: pkg
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE 
          APP_PATH=$(find build/Build/Products/${CONFIG}-iphoneos -maxdepth 1 -name "${APP_NAME}.app" | head -n1)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/bootstrap"
          cp bootstrap/procursus-rootless.tar "$APP_PATH/bootstrap/"
          cp bootstrap/Sileo.deb "$APP_PATH/bootstrap/"
          ldid -S kfd_a15/kfd_a15.entitlements "$APP_PATH/${APP_NAME}"
          ldid -e "$APP_PATH/${APP_NAME}" | head -n 40
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -la "${APP_NAME}-unsigned.ipa"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfd-a15-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 14
